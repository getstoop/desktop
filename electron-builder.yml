appId: com.getstoop.desktop
productName: Stoop
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tray
    to: .
# stoop:// — the Info.plist entry on macOS and the registry keys the NSIS
# installer writes on Windows. Linux carries it on the desktop entry, so
# the .deb registers it and an AppImage, having no install step, may not.
protocols:
  - name: Stoop
    schemes: [stoop]
mac:
  category: public.app-category.social-networking
  # What macOS shows when a screen share first asks for system audio;
  # without it electron-builder fills in a generic line.
  extendInfo:
    NSAudioCaptureUsageDescription: >-
      Stoop records your computer's audio so a screen share can carry
      the sound you are hearing.
    NSMicrophoneUsageDescription: >-
      Stoop uses the microphone so the people in a voice channel can
      hear you.
    NSCameraUsageDescription: >-
      Stoop uses the camera when you turn your video on in a voice
      channel.
  # Signing happens when a Developer ID Application certificate is there to
  # sign with (the keychain here, CSC_LINK in CI) and is skipped when not;
  # notarization likewise follows the APPLE_API_KEY* variables. The
  # hardened runtime is electron-builder's default and notarization
  # requires it. The helpers are given the app's entitlements rather than
  # electron-builder's stock set, which has no microphone or camera in it
  # and allows more than Electron has needed since 12.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # The dmg is what a person downloads; the zip is what the app's updater
  # downloads (src/main/updates.ts), and latest-mac.yml names it.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
win:
  target: nsis
  # No signing here. The Azure options that turn it on are in
  # electron-builder.windows-signing.yml, read by the Build release
  # workflow and nothing else: their presence is what signs, and Build
  # has no credentials to sign with.
linux:
  category: Network;Chat
  target: [AppImage, deb]
  icon: icons
  # The window icon: Linux takes it from BrowserWindow, not the bundle
  # (window.ts), so one size ships beside the app.
  extraResources:
    - from: resources/icons/256x256.png
      to: icon.png
  mimeTypes:
    - x-scheme-handler/stoop
# Also what app-update.yml, packed beside the app, points the updater at:
# the newest published release here. A draft is invisible to it.
publish:
  provider: github
  owner: getstoop
  repo: desktop
  releaseType: draft
