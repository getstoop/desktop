appId: com.getstoop.desktop
productName: Stoop
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tray
    to: .
# stoop:// — the Info.plist entry on macOS and the registry keys the NSIS
# installer writes on Windows. Linux carries it on the desktop entry, so
# the .deb registers it and an AppImage, having no install step, may not.
protocols:
  - name: Stoop
    schemes: [stoop]
mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [universal]
win:
  target: nsis
linux:
  category: Network;Chat
  target: [AppImage, deb]
  mimeTypes:
    - x-scheme-handler/stoop
publish:
  provider: github
  owner: getstoop
  repo: desktop
  releaseType: draft
