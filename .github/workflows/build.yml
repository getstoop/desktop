name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:version

  # A tag is a release (docs/releasing.md). It has to name the version
  # in package.json, and the draft the installers attach to is made
  # once, here: left to the package jobs, three of them would each look
  # for the release at the same moment, find none, and make their own.
  # The notes are docs/release-notes.md, which each release PR rewrites,
  # with the list of merged pull requests generated below them.
  release:
    name: Draft release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - name: Create the draft
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Stoop Desktop ${GITHUB_REF_NAME#v}" \
            --notes-file docs/release-notes.md --generate-notes \
            ${{ contains(github.ref_name, '-rc.') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Unsigned installers for every platform on every push; a tag also
  # attaches them to the draft release, which stays a draft until someone
  # publishes it. Signing (Desktop 11, 12) plugs into this job later.
  package:
    name: Package (${{ matrix.os }})
    needs: [check, release]
    # `release` is skipped on everything but a tag, and a skipped need
    # would skip this job with it.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm exec electron-builder --publish never
      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stoop-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
