name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:version

  # A tag is a release (docs/releasing.md). It has to name the version
  # in package.json, and the draft the installers attach to is made
  # once, here: left to the package jobs, three of them would each look
  # for the release at the same moment, find none, and make their own.
  # The notes are docs/release-notes.md, which each release PR rewrites,
  # with the list of merged pull requests generated below them.
  release:
    name: Draft release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - name: Create the draft
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Stoop Desktop ${GITHUB_REF_NAME#v}" \
            --notes-file docs/release-notes.md --generate-notes \
            ${{ contains(github.ref_name, '-rc.') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Installers for every platform on every push; a tag also attaches them
  # to the draft release, which stays a draft until someone publishes it.
  # The macOS one is signed and notarized for a tag and for a run started
  # by hand on main, once the secrets are there. Anything else is
  # unsigned. A push to main is: the certificate stays out of reach of
  # every dependency bump, and a release candidate is what tries the
  # signing before a release. A pull request and a run started by hand on
  # a branch are: what carries the certificate's name has been reviewed.
  # Windows' and Linux's are unsigned; Windows signing (STOOP-310) plugs
  # in the same way.
  package:
    name: Package (${{ matrix.os }})
    needs: [check, release]
    # `release` is skipped on everything but a tag, and a skipped need
    # would skip this job with it.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    # Notarization waits on Apple, minutes as a rule and hours when its
    # queue is slow; the default would let the job sit for six.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    permissions:
      contents: write
    env:
      # Off, electron-builder signs with nothing, whatever a keychain
      # holds, so it is on exactly where the certificate is handed over.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # After the install and the build, so no dependency's script runs with
      # these in reach. The certificate is a Developer ID Application .p12,
      # base64; the key is an App Store Connect API key, which
      # electron-builder wants as a file.
      #
      # The certificate goes into a keychain made here and named in
      # CSC_KEYCHAIN, not to electron-builder as CSC_LINK. Given a CSC_LINK
      # it makes a keychain of its own under a random password and then
      # hands `security set-key-partition-list` the certificate's password
      # in its place. macOS let that pass on an unlocked keychain until 26,
      # which checks it: "The user name or passphrase you entered is not
      # correct", with both passwords right.
      - name: Signing credentials (macOS)
        if: ${{ matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::a release has to be signed, and these secrets are not set:$missing"
              exit 1
            fi
            echo "::notice::building macOS unsigned; secrets not set:$missing"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MAC_CSC_LINK" | tr -d '[:space:]' | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # codesign looks an identity up through the search list.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application:"; then
            echo "::error::MAC_CSC_LINK holds no Developer ID Application identity macOS takes as valid"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          {
            echo "CSC_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "STOOP_MAC_SIGNED=1"
          } >> "$GITHUB_ENV"
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm exec electron-builder --publish never
      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # electron-builder only warns when it cannot sign or notarize, so ask
      # the bundle itself: a Developer ID signature that holds under the
      # hardened runtime, and Apple's ticket stapled to it. A tag's draft
      # release has its files by now; this going red is what says not to
      # publish it.
      - name: Verify signature and notarization (macOS)
        if: ${{ env.STOOP_MAC_SIGNED == '1' }}
        run: |
          app=dist/mac-universal/Stoop.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | tee /dev/stderr | grep -q "^Authority=Developer ID Application:"
          codesign -dvv "$app" 2>&1 | grep -q "flags=.*runtime"
          xcrun stapler validate "$app"
      # Kept two weeks, not the ninety days a repository defaults to:
      # these are for trying a branch, and every push leaves three more.
      # What is meant to last is a release, which carries its own.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stoop-${{ matrix.os }}
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
