name: Build release

# The second step of a release: merging a release candidate
# (cut-release-candidate.yml) builds it and leaves it unpublished. An
# installer for every platform goes on a draft release, signed. No tag is
# made here: GitHub makes it when the draft is published, and that is the
# release.
#
# A run started by hand on main is a rehearsal: the same installers,
# signed the same way, left on the run and attached to nothing. A failed
# build is run again from its run page. Nothing starts on a pushed tag.
#
# The signing secrets are read here and nowhere else. Build, which runs on
# every push and pull request, has none of them in reach.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every merge to main comes through here; only a release candidate's
  # goes on to a draft. A rehearsal has no version and is built all the
  # same.
  candidate:
    name: Find the release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.find.outputs.version }}
    steps:
      # What carries the certificate's name has been reviewed: main. The
      # button offers every branch, so say no here.
      - name: Only on main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Build release signs what it builds, so it runs on main, not on $GITHUB_REF_NAME. Build makes an unsigned installer from any branch."
          exit 1
      - id: find
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.ref // ""')
          case "$head" in
            release-candidate/*) echo "version=${head#release-candidate/}" >> "$GITHUB_OUTPUT" ;;
            *) echo "This merge is not a release candidate; nothing to build." ;;
          esac

  # The draft the installers attach to is made once, here: left to the
  # package jobs, three of them would each look for the release at the
  # same moment, find none, and make their own. It sits on the commit that
  # is built, and its notes are docs/release-notes.md as the release
  # candidate left it.
  draft:
    name: Draft release
    needs: candidate
    if: ${{ needs.candidate.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.candidate.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, to know this release is newer than the newest.
          fetch-depth: 0
      - name: Check the version against the tree
        run: |
          fail() { echo "::error::$1"; exit 1; }
          number='(0|[1-9][0-9]*)'
          release="^$number\.$number\.$number$"
          [[ "$VERSION" =~ $release ]] || fail "\"$VERSION\" is not a version."
          node scripts/check-version.mjs "$VERSION"
          newest=$(git tag --list 'v*' | sed 's/^v//' | grep -E "$release" | sort -V | tail -n 1 || true)
          [ "$VERSION" != "$newest" ] && [ "$(printf '%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ] ||
            fail "$VERSION is not newer than $newest, the newest release."
      - name: Create the draft
        run: |
          # A run started again replaces the draft the first one left.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Stoop Desktop $VERSION" \
            --notes-file docs/release-notes.md

  # Build's package job with the signing around it; a change to how the
  # app is built belongs in both. The macOS installer is signed and
  # notarized, the Windows one is signed, and Linux's is unsigned.
  package:
    name: Package (${{ matrix.os }})
    needs: [candidate, draft]
    # `draft` is skipped for a rehearsal, and a skipped need would skip
    # this job with it.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.candidate.result == 'success')) }}
    runs-on: ${{ matrix.os }}
    # Notarization waits on Apple, minutes as a rule and hours when its
    # queue is slow; the default would let the job sit for six.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    permissions:
      contents: write
    env:
      # Off, electron-builder signs with nothing, whatever a keychain
      # holds, so it is on exactly where the certificate is handed over.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' }}
      # Windows signs by configuration, not by what is within reach: the
      # Azure options are a second file on top of electron-builder.yml,
      # read here and not by Build.
      BUILDER_CONFIG: ${{ matrix.os == 'windows-latest' && '--config electron-builder.windows-signing.yml' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # After the install and the build, so no dependency's script runs with
      # these in reach. The certificate is a Developer ID Application .p12,
      # base64; the key is an App Store Connect API key, which
      # electron-builder wants as a file.
      #
      # The certificate goes into a keychain made here and named in
      # CSC_KEYCHAIN, not to electron-builder as CSC_LINK. Given a CSC_LINK
      # it makes a keychain of its own under a random password and then
      # hands `security set-key-partition-list` the certificate's password
      # in its place. macOS let that pass on an unlocked keychain until 26,
      # which checks it: "The user name or passphrase you entered is not
      # correct", with both passwords right.
      - name: Signing credentials (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::a release has to be signed, and these secrets are not set:$missing"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MAC_CSC_LINK" | tr -d '[:space:]' | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # codesign looks an identity up through the search list.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::MAC_CSC_LINK holds no Developer ID Application identity macOS takes as valid"
            exit 1
          fi
          # The log is public and the certificate is in a person's name
          # until the membership is an organization's. Its common name is
          # "Developer ID Application: <name> (<team id>)"; from here on
          # the runner prints the name as asterisks wherever it appears,
          # which is electron-builder's identityName line. The name is
          # still in the signed app, for anyone who asks codesign.
          name=${identity#Developer ID Application: }
          name=${name% (*}
          echo "::add-mask::$name"
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          {
            echo "CSC_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      # An Entra app registration allowed to sign with the certificate
      # profile, as the three variables the Azure SDK reads on its own.
      # Handed over at the same point as the macOS certificate, and for
      # the same reason.
      - name: Signing credentials (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::a release has to be signed, and these secrets are not set:$missing"
            exit 1
          fi
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - if: ${{ needs.candidate.outputs.version == '' }}
        run: pnpm exec electron-builder --publish never ${{ env.BUILDER_CONFIG }}
      # electron-builder finds the draft by the tag it will carry,
      # v<package.json's version>, and attaches what it builds.
      - if: ${{ needs.candidate.outputs.version != '' }}
        run: pnpm exec electron-builder --publish always ${{ env.BUILDER_CONFIG }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # electron-builder only warns when it cannot sign or notarize, so ask
      # the bundle itself: a Developer ID signature that holds under the
      # hardened runtime, and Apple's ticket stapled to it. The draft
      # release has its files by now; this going red is what says not to
      # publish it.
      - name: Verify signature and notarization (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          app=dist/mac-universal/Stoop.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -q "^Authority=Developer ID Application:"
          codesign -dvv "$app" 2>&1 | grep -q "flags=.*runtime"
          xcrun stapler validate "$app"
      # The same question of the Windows build. Every signature has to
      # hold, carry a timestamp (the certificate lasts three days; the
      # timestamp is what keeps the signature good after it), and name the
      # publisher an installed app will hold an update to, which is what
      # electron-builder wrote into app-update.yml from
      # electron-builder.windows-signing.yml.
      - name: Verify signatures (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $yml = Get-Content -Raw dist/win-unpacked/resources/app-update.yml
          if ($yml -notmatch '(?m)^publisherName:[ \t]*\r?\n[ \t]*-[ \t]*(\S.*?)[ \t\r]*$') {
            Write-Host "::error::app-update.yml names no publisher, so an installed app would take an update signed by anyone"
            exit 1
          }
          $publisher = $Matches[1]
          $files = @('dist/win-unpacked/Stoop.exe') + (Get-ChildItem dist/*.exe).FullName
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            $signer = $sig.SignerCertificate
            $subject = if ($signer) { $signer.Subject } else { 'nobody' }
            # electron-updater's rule: a bare name is the common name; a
            # distinguished name matches on every field it names.
            $named = if (-not $signer) {
              $false
            } elseif ($publisher -match '=') {
              @($publisher -split ',\s*' | Where-Object { $subject -cnotmatch "(^|, )$([regex]::Escape($_))(,|$)" }).Count -eq 0
            } else {
              $publisher -ceq $signer.GetNameInfo('SimpleName', $false)
            }
            $stamped = if ($sig.TimeStamperCertificate) { 'timestamped' } else { 'not timestamped' }
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate -or -not $named) {
              Write-Host "::error::${file}: $($sig.Status), $stamped, signed by '$subject' where the app expects '$publisher'"
              exit 1
            }
            Write-Host "${file}: $($sig.Status), $stamped, signed by $subject"
          }
      # For a rehearsal, which attaches to nothing, and kept two weeks as
      # Build's are. A release carries its own.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stoop-${{ matrix.os }}
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error
