name: Cut release candidate

# The first step of a release (docs/releasing.md): started by hand with
# the version to release, it opens the pull request that proposes it. The
# pull request moves the version, drafts the notes from the commits since
# the last release, and is labelled major, minor or patch. Merging it is
# what builds the release (build-release.yml).
#
# RELEASE_TOKEN is a token of our own: a pull request opened with the
# workflow's default token starts no other workflow, so Build would never
# run on it and it could not merge.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, like 0.3.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate

jobs:
  candidate:
    name: Open the release candidate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Only on main, with the token
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release candidate is cut from main, not from $GITHUB_REF_NAME."
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is not set."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, to find the last release, and the commits since it.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # The version has to be the next one: one patch, minor or major on
      # from the newest release tag.
      - name: Check the version
        id: check
        run: |
          fail() { echo "::error::$1"; exit 1; }
          number='(0|[1-9][0-9]*)'
          release="^$number\.$number\.$number$"
          [[ "$VERSION" =~ $release ]] || fail "\"$VERSION\" is not a version: give three numbers, like 0.3.0."

          previous=$(git tag --list 'v*' | sed 's/^v//' | grep -E "$release" | sort -V | tail -n 1 || true)
          [ -n "$previous" ] || fail "There is no release tag to follow."
          IFS=. read -r major minor patch <<< "$previous"
          next_patch="$major.$minor.$((patch + 1))"
          next_minor="$major.$((minor + 1)).0"
          next_major="$((major + 1)).0.0"
          case "$VERSION" in
            "$next_patch") kind=patch ;;
            "$next_minor") kind=minor ;;
            "$next_major") kind=major ;;
            *) fail "$VERSION does not follow $previous: the next release is $next_patch (patch), $next_minor (minor) or $next_major (major)." ;;
          esac
          [ -n "$(git log --no-merges --format=%h "v$previous..HEAD")" ] || fail "Nothing has been merged since $previous."

          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Write the release
        env:
          PREVIOUS: ${{ steps.check.outputs.previous }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # The version the app carries, which lives in one place.
          line='^  "version": "'
          [ "$(grep -c "$line" package.json)" = 1 ] || fail "Want one version line in package.json."
          sed -E "s|($line).*(\",)$|\1$VERSION\2|" package.json > "$RUNNER_TEMP/package.json"
          cp "$RUNNER_TEMP/package.json" package.json

          # The notes start as the commits since the last release, oldest
          # first, and are edited by hand in the pull request. The first
          # line names the version, which scripts/check-version.mjs holds
          # every push to.
          {
            printf 'Stoop Desktop %s\n\nChanges since %s:\n\n' "$VERSION" "$PREVIOUS"
            git log --no-merges --reverse --format='- %s (%h)' "v$PREVIOUS..HEAD"
          } > docs/release-notes.md

      - name: Open the pull request
        env:
          KIND: ${{ steps.check.outputs.kind }}
          PREVIOUS: ${{ steps.check.outputs.previous }}
        run: |
          branch="release-candidate/$VERSION"
          gh label create "$KIND" --color 5319e7 --description "A $KIND release" --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json docs/release-notes.md
          git commit -m "Release $VERSION"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The release candidate for Stoop Desktop $VERSION, a $KIND release after $PREVIOUS.

          - \`package.json\` carries the version $VERSION.
          - \`docs/release-notes.md\` lists the commits on main since $PREVIOUS. **Edit it in this pull request** before merging, and keep its first line.

          Merging builds the installers and leaves them unpublished, on a draft release. Publishing the draft is the release.
          EOF
          gh pr create --base main --head "$branch" --label "$KIND" \
            --title "Release $VERSION" --body-file "$RUNNER_TEMP/body.md"
