<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*" />
    <title>Add a server</title>
    <link rel="stylesheet" href="../shell.css" />
  </head>
  <body>
    <main class="centre">
      <form id="open" class="login-card" novalidate>
        <img src="../mark.svg" alt="" width="40" height="40" />
        <h1>Stoop</h1>
        <p id="subtitle" class="login-subtitle">Enter the address of a server to open it here. It is the one you use in a browser, and you sign in the same way.</p>
        <label class="field">Server address
          <input id="url" type="text" placeholder="https://chat.example.com" autocomplete="off" spellcheck="false" required />
        </label>
        <p id="error" class="error" hidden></p>
        <p id="detail" class="detail" hidden></p>
        <div class="actions"><button id="submit" type="submit" class="primary">Open</button></div>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
