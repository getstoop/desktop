<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:*" />
    <title>Stoop</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 32px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 12px;
        padding-left: 84px;
        /* The gear sits 12px in from the edge; the window buttons, when
           there are any, run past it to the edge itself. */
        padding-right: 12px;
        background: #141517;
        color: #e6e7ea;
        font: 12px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }
      body.no-lights { padding-left: 12px; }
      #controls { margin-right: -12px; }
      #server {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border: none;
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.18);
        color: inherit;
        font: inherit;
        font-weight: 600;
        -webkit-app-region: no-drag;
        cursor: default;
      }
      #server:hover { background: rgba(127, 127, 127, 0.3); }
      #server[hidden] { display: none; }
      #dot {
        position: absolute;
        top: 3px;
        right: 3px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e2725b;
      }
      #dot[hidden] { display: none; }
      /* Everything that belongs at the other end of the strip. One auto
         margin, on the group: two of them would share the free space
         between them and strand the update pill in the middle. */
      #right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 100%;
        -webkit-app-region: no-drag;
      }
      #update {
        padding: 3px 10px;
        border: 1px solid currentColor;
        border-radius: 999px;
        background: none;
        color: inherit;
        font: inherit;
        opacity: 0.85;
        -webkit-app-region: no-drag;
      }
      #update:hover { opacity: 1; background: rgba(127, 127, 127, 0.18); }
      #update[hidden] { display: none; }
      /* A square inset in the strip rather than a full-height slab: the
         strip is 32px and this sits 4px clear of both edges, so the lit
         background reads as a control with room around it. The window
         buttons opposite are full height because that is the platform's
         shape for them, not the app's. */
      #gear {
        width: 24px;
        height: 24px;
        /* Flex, and padding zeroed: a button carries 1px 6px of its own
           by default, which with border-box shrinks the box the icon is
           centred in and pushes it off. Chromium's anonymous button box
           does not lay out as a grid reliably either. */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex: 0 0 auto;
        border: none;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        line-height: 0;
        opacity: 0.75;
      }
      /* Hover only while the strip still has the pointer. Losing the
         window can leave :hover on whatever it was last over, and a lit
         gear means "App settings is in front", not "the mouse passed
         through here ten minutes ago". */
      body:not(.pointer-gone) #gear:hover {
        opacity: 1;
        background: rgba(127, 127, 127, 0.25);
      }
      /* Open, not hovered. The two have to look like different kinds of
         thing: hover is a grey wash that follows the pointer, this is the
         accent, and it stays put because App settings is what is in
         front. Same grey for both read as a hover that had got stuck. */
      #gear[aria-pressed="true"] {
        opacity: 1;
        color: var(--accent, currentColor);
        background: color-mix(in srgb, var(--accent, #888) 22%, transparent);
      }
      #gear:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
      #controls {
        display: flex;
        height: 100%;
        -webkit-app-region: no-drag;
      }
      #controls[hidden] { display: none; }
      #controls button {
        width: 46px;
        height: 100%;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
      }
      #controls button:hover { background: rgba(127, 127, 127, 0.25); }
      #controls button.close:hover { background: #e05c5c; color: #fff; }
      /* The live indicator: centred, the one stretch of the strip nothing
         else claims, so it stays put whichever side the window buttons
         are on. --ok and --danger come from the theme. */
      #voice {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        max-width: 44vw;
        border-radius: 999px;
        background: rgba(127, 127, 127, 0.18);
        -webkit-app-region: no-drag;
      }
      #voice[hidden] { display: none; }
      #voice-open {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        height: 22px;
        padding: 0 9px 0 7px;
        border: none;
        border-radius: 999px;
        background: none;
        color: inherit;
        font: inherit;
        opacity: 0.75;
      }
      #voice-open svg { flex: 0 0 auto; }
      #voice-open svg.off { opacity: 0.6; }
      #where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #voice.mic, #voice.camera { background: color-mix(in srgb, var(--ok) 20%, transparent); }
      #voice.mic #voice-open, #voice.camera #voice-open { opacity: 1; }
      #voice.mic svg:not(.off), #voice.camera svg:not(.off) { color: var(--ok); }
      #voice.screen { padding-right: 3px; background: var(--danger); color: #fff; }
      #voice.screen #voice-open { opacity: 1; }
      #voice.error { background: none; box-shadow: inset 0 0 0 1px var(--danger); color: var(--danger); }
      #voice.error #voice-open { opacity: 1; }
      #voice.joining #voice-open { font-style: italic; }
      #voice-stop {
        flex: 0 0 auto;
        height: 16px;
        padding: 0 8px;
        border: none;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.22);
        color: inherit;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
      }
      #voice-stop[hidden] { display: none; }
      #voice-open:focus-visible, #voice-stop:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
      /* The call's first moment: the pill drops into the strip, then pings
         twice in its own colour. */
      #voice::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
      }
      #voice.mic::after, #voice.camera::after { color: var(--ok); }
      #voice.screen::after, #voice.error::after { color: var(--danger); }
      #voice.intro { animation: voice-in 360ms cubic-bezier(0.2, 0, 0, 1); }
      #voice.intro::after { animation: voice-ping 900ms ease-out 300ms 2; }
      @keyframes voice-in {
        from { opacity: 0; transform: translate(-50%, -160%); }
        to { opacity: 1; transform: translate(-50%, -50%); }
      }
      #voice.outro { animation: voice-out 240ms cubic-bezier(0.4, 0, 1, 1) forwards; pointer-events: none; }
      @keyframes voice-out {
        from { opacity: 1; transform: translate(-50%, -50%); }
        to { opacity: 0; transform: translate(-50%, -160%); }
      }
      @keyframes voice-ping {
        from { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 60%, transparent); }
        to { box-shadow: 0 0 0 5px transparent; }
      }
      @media (prefers-reduced-motion: reduce) {
        #voice.intro, #voice.intro::after, #voice.outro { animation: none; }
      }
    </style>
  </head>
  <body>
    <button id="server" type="button" hidden>
      <span id="name"></span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      <span id="dot" hidden></span>
    </button>
    <div id="voice" hidden>
      <button id="voice-open" type="button"><span id="voice-icons"></span><span id="where"></span></button>
      <button id="voice-stop" type="button" hidden>Stop</button>
    </div>
    <div id="right">
      <button id="update" type="button" hidden title="This server is newer than this app. Update the app to use everything it offers.">Update the app</button>
      <button id="gear" type="button" aria-pressed="false" aria-label="App settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.48.66.85 1.19.94H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
    <div id="controls" hidden>
      <button type="button" data-action="minimize" title="Minimize">&#x2013;</button>
      <button type="button" data-action="maximize" title="Maximize">&#x25A1;</button>
      <button type="button" class="close" data-action="close" title="Close">&#x2715;</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
